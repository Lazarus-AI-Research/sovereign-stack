# Runtime overlay: AMD ROCm x86_64 (design.md §8.2).
services:
  sovereign-runtime:
    image: docker.io/lazarus-ai-research/sovereign-runtime:rocm-x86_64-${SOVEREIGN_VERSION}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    security_opt:
      - seccomp=unconfined
    environment:
      SOVEREIGN_PROFILE: rocm-x86_64
      VLLM_BACKEND: rocm
