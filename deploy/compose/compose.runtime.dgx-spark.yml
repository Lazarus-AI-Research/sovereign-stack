# Runtime overlay: NVIDIA DGX Spark (CUDA arm64, unified memory).
services:
  sovereign-runtime:
    image: ghcr.io/lazarus-ai-research/sovereign-runtime:cuda-arm64-dgx-spark-${SOVEREIGN_VERSION}
    gpus: all
    ipc: host
    environment:
      SOVEREIGN_PROFILE: cuda-arm64-dgx-spark
      VLLM_BACKEND: cuda
      NVIDIA_VISIBLE_DEVICES: all
