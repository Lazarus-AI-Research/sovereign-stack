# Sovereign Stack core Compose file (design.md §8.1).
#
# Run with the project directory set to deploy/ so that relative paths and
# .env resolve correctly — use deploy/scripts/sovereign, or:
#   docker compose --project-directory deploy -f deploy/compose/compose.yml ...
# Combine with exactly one compose.runtime.<profile>.yml overlay.

name: sovereign-stack

services:
  caddy:
    image: ${CADDY_IMAGE}
    container_name: sovereign-caddy
    restart: unless-stopped
    depends_on:
      - sovereign-control
      - sovereign-workspace
    # Access mode and site address are generated by the host-side CLI.
    env_file:
      - ${SOVEREIGN_ENV_FILE:-.env}
    ports:
      - "${SOVEREIGN_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-54854}:80"
      - "${SOVEREIGN_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./branding:/srv/branding:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sovereign

  sovereign-control:
    image: ${SOVEREIGN_CONTROL_IMAGE}
    container_name: sovereign-control
    # Match the installer owner so owner-only host secrets remain 0600 while
    # still being readable by the otherwise non-root Control process. This
    # also keeps reports, backups, and config edits owned by the host user.
    user: "${SOVEREIGN_HOST_UID:?installer must set SOVEREIGN_HOST_UID}:${SOVEREIGN_HOST_GID:?installer must set SOVEREIGN_HOST_GID}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${SOVEREIGN_ENV_FILE:-.env}
    environment:
      SOVEREIGN_ROOT: /sovereign
      DATABASE_URL: ${CONTROL_DATABASE_URL}
      LITELLM_BASE_URL: http://sovereign-gateway:4000
      RUNTIME_BASE_URL: http://sovereign-runtime:8000
      SOVEREIGN_EMBEDDINGS_BASE_URL: ${SOVEREIGN_EMBEDDINGS_BASE_URL}
      SOVEREIGN_OPERATOR_TOKEN: ${SOVEREIGN_OPERATOR_TOKEN}
      DOCKER_PROXY_BASE_URL: http://sovereign-docker-proxy:8081
      PROMETHEUS_BASE_URL: http://prometheus:9090
      PHOENIX_BASE_URL: http://phoenix:6006
      LOKI_BASE_URL: http://loki:3100
      WORKSPACE_INDEX_ADMIN_URL: http://sovereign-workspace:3011
      LITELLM_CONFIG_PATH: ${LITELLM_CONFIG_PATH:-/sovereign/config/litellm/config.yaml}
    volumes:
      - ./:/sovereign
      - ${SOVEREIGN_RELEASE_ROOT:-.}:/sovereign-release:ro
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sovereign

  sovereign-docker-proxy:
    image: ${SOVEREIGN_DOCKER_PROXY_IMAGE}
    container_name: sovereign-docker-proxy
    restart: unless-stopped
    env_file:
      - ${SOVEREIGN_ENV_FILE:-.env}
    environment:
      DOCKER_PROXY_TOKEN: ${DOCKER_PROXY_TOKEN}
      ALLOWLIST_PATH: /etc/sovereign/allowlist.yaml
      AUDIT_LOG_PATH: /audit/docker-actions.jsonl
      SOVEREIGN_VERSION: ${SOVEREIGN_VERSION}
      DEPLOY_ROOT: ${DEPLOY_ROOT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/docker-proxy:/etc/sovereign:ro
      - ./logs/docker-proxy:/audit
    expose:
      - "8081"
    networks:
      - sovereign

  sovereign-workspace:
    image: ${SOVEREIGN_WORKSPACE_IMAGE}
    container_name: sovereign-workspace
    restart: unless-stopped
    env_file:
      - ${SOVEREIGN_ENV_FILE:-.env}
    environment:
      SOVEREIGN_VERSIONED_INDEXES: "true"
      SOVEREIGN_INDEX_ADMIN_PORT: "3011"
      SIMPLE_SSO_ENABLED: "1"
      SIMPLE_SSO_NO_LOGIN: "1"
      JWT_SECRET: ${WORKSPACE_JWT_SECRET}
    volumes:
      - anythingllm_data:/app/server/storage
      - ./branding:/sovereign-branding:ro
      - ./branding/lazarus_favicon.png:/app/server/public/favicon.png:ro
      # Lazarus streaming-spinner injection; regenerated per pinned
      # AnythingLLM version (§16 release gate).
      - ./config/workspace/_index.html:/app/server/public/_index.html:ro
      - ./config/workspace/index.css:/app/server/public/index.css:ro
    expose:
      - "3001"
      - "3011"
    networks:
      - sovereign

  sovereign-gateway:
    image: ${LITELLM_IMAGE}
    container_name: sovereign-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      sovereign-runtime:
        condition: service_healthy
    env_file:
      - ${SOVEREIGN_ENV_FILE:-.env}
    command:
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    volumes:
      - ${LITELLM_CONFIG_HOST_PATH:-./config/litellm/config.yaml}:/app/config.yaml:ro
    expose:
      - "4000"
    networks:
      - sovereign

  sovereign-runtime:
    image: ${SOVEREIGN_RUNTIME_IMAGE}
    container_name: sovereign-runtime
    restart: unless-stopped
    env_file:
      - ${SOVEREIGN_ENV_FILE:-.env}
    environment:
      SOVEREIGN_RUNTIME_CONFIG: /runtime-config/runtime.yaml
      SOVEREIGN_RUNTIME_MANIFEST: /runtime-state/manifest.json
    volumes:
      - ./config/runtime.yaml:/runtime-config/runtime.yaml:ro
      - ./models:/models
      - runtime_state:/runtime-state
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/sovereign-runtime-healthcheck
        - --live
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks:
      - sovereign

  postgres:
    image: ${PGVECTOR_IMAGE}
    container_name: sovereign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER}
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sovereign

  phoenix:
    image: ${PHOENIX_IMAGE}
    container_name: sovereign-phoenix
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${SOVEREIGN_ENV_FILE:-.env}
    environment:
      PHOENIX_SQL_DATABASE_URL: ${PHOENIX_SQL_DATABASE_URL:?set PHOENIX_SQL_DATABASE_URL to the persistent phoenix database}
      PHOENIX_HOST_ROOT_PATH: /apps/phoenix
    expose:
      - "6006"
      - "4317"
    networks:
      - sovereign

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: sovereign-prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - sovereign

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: sovereign-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "${SOVEREIGN_PUBLIC_URL}/apps/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-Sovereign-User
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"
    networks:
      - sovereign

  loki:
    image: ${LOKI_IMAGE}
    container_name: sovereign-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    expose:
      - "3100"
    networks:
      - sovereign

  otel-collector:
    image: ${OTEL_IMAGE}
    container_name: sovereign-otel
    restart: unless-stopped
    command:
      - --config=/etc/otelcol/config.yml
    volumes:
      - ./config/otel/collector.yml:/etc/otelcol/config.yml:ro
    expose:
      - "4317"
      - "4318"
    networks:
      - sovereign

  sovereign-evals:
    image: ${SOVEREIGN_EVALS_IMAGE}
    container_name: sovereign-evals
    profiles:
      - tools
    restart: "no"
    env_file:
      - ${SOVEREIGN_ENV_FILE:-.env}
    volumes:
      - ./config:/sovereign/config:ro
      - ./reports:/sovereign/reports
    networks:
      - sovereign

volumes:
  postgres_data:
  anythingllm_data:
  runtime_state:
  prometheus_data:
  grafana_data:
  loki_data:
  caddy_data:
  caddy_config:

networks:
  sovereign:
    name: sovereign
