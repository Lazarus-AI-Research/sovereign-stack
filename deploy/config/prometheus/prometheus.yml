# Sovereign Observe metrics scraping (design.md §21).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: sovereign-runtime
    static_configs:
      - targets: ["sovereign-runtime:8000"]

  - job_name: sovereign-control
    # Control exports authenticated LiteLLM health as
    # sovereign_control_gateway_up. Direct LiteLLM /metrics scraping requires
    # a master key in the supported image and may be license-gated; never put
    # that credential in this tracked configuration.
    static_configs:
      - targets: ["sovereign-control:8080"]
