# Sovereign Runtime configuration for the metal-arm64 profile (Phase 2:
# host inference agent, design.md §2.6). Models are served host-side by the
# agent (llama.cpp on Metal); model fields here describe intent and drive
# aliases — the agent's own config selects the GGUF artifacts.
# Validated against schemas/runtime-config.schema.json.

schema_version: "1.1"

runtime:
  listen_address: 0.0.0.0
  port: 8000
  api_key_env: SOVEREIGN_RUNTIME_API_KEY
  profile: metal-arm64

startup:
  smoke_test_on_start: true
  remain_alive_on_configuration_error: true

roles:
  generation:
    enabled: true
    task: generate
    source: local
    model: google/gemma-4-E2B-it-qat-q4_0-gguf
    served_model_name: assistant-large
    priority: high
    memory_weight: 82
    max_concurrent_requests: 4

  embedding:
    enabled: true
    task: embed
    source: local
    model: marksverdhei/LCO-Embedding-Omni-3B-2605-GGUF
    served_model_name: embedding-omni-default
    priority: low
    memory_weight: 18
    max_concurrent_requests: 4
    throttle_when_generation_queue_above: 2
    pooling: last
    normalization: l2

observability:
  prometheus: true
  structured_logs: true
  otlp_endpoint: http://otel-collector:4317

privacy:
  prompt_logging: false
  response_logging: false
  full_trace: false
