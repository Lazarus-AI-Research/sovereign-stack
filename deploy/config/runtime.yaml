# Sovereign Runtime configuration (design.md §12).
# Validated against schemas/runtime-config.schema.json.

schema_version: "1.1"

runtime:
  listen_address: 0.0.0.0
  port: 8000
  api_key_env: SOVEREIGN_RUNTIME_API_KEY
  profile: cuda-x86_64

startup:
  smoke_test_on_start: true
  remain_alive_on_configuration_error: true
  fail_process_on_generation_error: false
  fail_process_on_embedding_error: false

roles:
  generation:
    enabled: true
    task: generate
    source: huggingface
    model: google/gemma-4-E2B-it
    revision: 9dbdf8a839e4e9e0eb56ed80cc8886661d3817cf
    served_model_name: assistant-large
    max_model_len: 2048
    priority: high
    memory_weight: 52
    max_concurrent_requests: 2
    engine_args:
      - --enforce-eager

  embedding:
    enabled: false
    task: embed

observability:
  prometheus: true
  structured_logs: true
  otlp_endpoint: http://otel-collector:4317

privacy:
  prompt_logging: false
  response_logging: false
  full_trace: false
