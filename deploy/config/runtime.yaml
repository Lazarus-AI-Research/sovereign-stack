# Sovereign Runtime configuration (design.md §12).
# Validated against schemas/runtime-config.schema.json.

schema_version: "1.1"

runtime:
  listen_address: 0.0.0.0
  port: 8000
  api_key_env: SOVEREIGN_RUNTIME_API_KEY
  profile: cuda-x86_64

startup:
  smoke_test_on_start: true
  remain_alive_on_configuration_error: true
  fail_process_on_generation_error: false
  fail_process_on_embedding_error: false

roles:
  generation:
    enabled: true
    task: generate
    source: huggingface
    model: Qwen/Qwen3-32B-AWQ
    revision: "<immutable-revision>"
    served_model_name: assistant-large
    max_model_len: 32768
    priority: high
    memory_weight: 82
    max_concurrent_requests: 8

  embedding:
    enabled: true
    task: embed
    source: huggingface
    model: LCO-Embedding/LCO-Embedding-Omni-3B-2605
    revision: "<immutable-revision>"
    served_model_name: embedding-omni-default
    priority: low
    memory_weight: 18
    max_concurrent_requests: 4
    throttle_when_generation_queue_above: 2
    pooling: last
    normalization: l2

observability:
  prometheus: true
  structured_logs: true
  otlp_endpoint: http://otel-collector:4317

privacy:
  prompt_logging: false
  response_logging: false
  full_trace: false
