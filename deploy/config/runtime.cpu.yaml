# Sovereign Runtime configuration for the cpu bring-up profile.
# Small models sized for CPU inference; the served aliases stay product-stable
# (§2.2) while the engine models differ from the accelerator profiles.
# Validated against schemas/runtime-config.schema.json.

schema_version: "1.1"

runtime:
  listen_address: 0.0.0.0
  port: 8000
  api_key_env: SOVEREIGN_RUNTIME_API_KEY
  profile: cpu-x86_64

startup:
  smoke_test_on_start: true
  remain_alive_on_configuration_error: true
  fail_process_on_generation_error: false
  fail_process_on_embedding_error: false

roles:
  generation:
    enabled: true
    task: generate
    source: huggingface
    model: Qwen/Qwen3-0.6B
    revision: main
    served_model_name: assistant-large
    max_model_len: 8192
    priority: high
    memory_weight: 82
    max_concurrent_requests: 2

  # Text-compact embedding fallback (§10.2). Enabled with the multi-role
  # milestone (M8); until then the runtime serves generation only.
  embedding:
    enabled: false
    task: embed
    source: huggingface
    model: Qwen/Qwen3-Embedding-0.6B
    revision: main
    served_model_name: embedding-text-compact
    priority: low
    memory_weight: 18
    max_concurrent_requests: 2
    throttle_when_generation_queue_above: 2
    pooling: last
    normalization: l2

observability:
  prometheus: true
  structured_logs: true
  otlp_endpoint: http://otel-collector:4317

privacy:
  prompt_logging: false
  response_logging: false
  full_trace: false
