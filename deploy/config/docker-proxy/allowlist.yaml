# Sovereign Docker Proxy allowlist (design.md §3.6, §22).
# The proxy exposes only these operations, services, and image namespaces.

allowed_project: sovereign-stack

allowed_image_prefixes:
  - ghcr.io/lazarus-ai-research/

allowed_services:
  - sovereign-runtime
  - sovereign-gateway
  - sovereign-workspace
  - sovereign-evals

allowed_operations:
  - inspect
  - list
  - restart
  - pull
  - logs
  - run-evals
  - backup

# The evals container the proxy may create. Nothing here is caller-controlled
# except the suite name; env values come from the proxy's own environment.
# ${DEPLOY_ROOT} expands from the proxy's environment (install-specific).
evals:
  image_prefix: ghcr.io/lazarus-ai-research/sovereign-evals
  network: sovereign
  binds:
    - ${DEPLOY_ROOT}/reports:/sovereign/reports
  env_keys:
    - RUNTIME_BASE_URL
    - LITELLM_BASE_URL
    - PROMETHEUS_BASE_URL
    - SOVEREIGN_RUNTIME_API_KEY
    - LITELLM_MASTER_KEY
    - PGVECTOR_CONNECTION_STRING

# Fixed database dump/restore container (§18.11). The script is proxy-code-
# fixed; only the validated backup stamp is caller-controlled.
backup:
  image: pgvector/pgvector:pg16
  network: sovereign
  binds:
    - ${DEPLOY_ROOT}/backups:/backups
  env_keys:
    - POSTGRES_USER
  databases:
    - sovereign_control
    - litellm
    - workspace
    - phoenix
    - vectors
