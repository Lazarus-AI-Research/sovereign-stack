# Sovereign Docker Proxy allowlist (design.md §3.6, §22).
# The proxy exposes only these operations, services, and image namespaces.

allowed_project: sovereign-stack

allowed_image_prefixes:
  - ghcr.io/lazarus-ai-research/

allowed_services:
  - sovereign-runtime
  - sovereign-gateway
  - sovereign-workspace
  - sovereign-evals

allowed_operations:
  - inspect
  - list
  - restart
  - pull
  - logs
  - run-evals

# The only container the proxy may create. Nothing here is caller-controlled
# except the suite name; env values come from the proxy's own environment.
evals:
  image_prefix: ghcr.io/lazarus-ai-research/sovereign-evals
  network: sovereign
  binds: []
  env_keys:
    - RUNTIME_BASE_URL
    - LITELLM_BASE_URL
    - PROMETHEUS_BASE_URL
    - SOVEREIGN_RUNTIME_API_KEY
    - LITELLM_MASTER_KEY
    - PGVECTOR_CONNECTION_STRING
