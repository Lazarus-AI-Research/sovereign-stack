name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io/lazarus-ai-research

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control/web/package-lock.json
      - name: Require exact release version
        run: test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
      - name: Shell and repository checks
        run: |
          bash -n deploy/scripts/*.sh deploy/scripts/sovereign
          chmod +x tests/scripts/*.sh
          tests/scripts/release-artifacts.sh
          git diff --check
      - name: Go services
        run: |
          (cd control && go vet ./... && go test ./...)
          (cd docker-proxy && go vet ./... && go test ./...)
      - name: Evals and schema contracts
        run: |
          python -m pip install -e 'evals[dev]' jsonschema PyYAML
          pytest evals/tests
          python release/validate_contracts.py
      - name: Control UI
        run: npm ci --prefix control/web --no-fund --no-audit && npm run build --prefix control/web
      - name: Compose contracts
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --project-directory deploy --env-file deploy/.env \
            -f deploy/compose/compose.yml -f deploy/compose/compose.runtime.cuda.yml config -q
          docker compose --project-directory deploy --env-file deploy/.env \
            -f deploy/compose/compose.yml -f deploy/compose/compose.runtime.metal.yml config -q

  images:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sovereign-control
            dockerfile: control/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: sovereign-docker-proxy
            dockerfile: docker-proxy/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: sovereign-evals
            dockerfile: evals/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: sovereign-workspace
            dockerfile: workspace/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: sovereign-embeddings
            dockerfile: embeddinggemma/Dockerfile.cuda
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
      - name: Sign image index
        run: cosign sign --yes "${REGISTRY}/${{ matrix.name }}:${VERSION}@${{ steps.build.outputs.digest }}"
      - name: Record digest
        run: |
          mkdir -p digests
          printf '%s\n' '${{ steps.build.outputs.digest }}' > 'digests/${{ matrix.name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          if-no-files-found: error

  publish:
    needs: [validate, images]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Resolve required runtime releases
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for profile in cuda-x86_64 metal-arm64; do
            ref="$REGISTRY/sovereign-runtime:$profile-$VERSION"
            digest="$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/ {print $2; exit}')"
            test -n "$digest"
            case "$profile" in
              cuda-x86_64) name=sovereign-runtime-cuda ;;
              metal-arm64) name=sovereign-runtime-metal ;;
            esac
            printf '%s\n' "$digest" > "digests/$name"
            cosign verify \
              --certificate-identity-regexp '^https://github.com/Lazarus-AI-Research/sovereign-vllm/.github/workflows/release.yml@refs/tags/v' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$ref@$digest" >/dev/null
          done
      - name: Generate release manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 release/generate_manifest.py \
            --digest-dir digests \
            --stack-commit "$GITHUB_SHA" \
            --output release/manifest.json \
            --image-lock-output release/images.env
          python3 -m pip install jsonschema PyYAML
          python3 release/validate_contracts.py
          test "$(python3 -c 'import json; print(json.load(open("release/manifest.json"))["version"])')" = "$VERSION"
      - name: Vendor pinned EmbeddingGemma Metal executable
        run: |
          set -euo pipefail
          mkdir -p deploy/assets
          curl -fsSL --retry 4 \
            -o deploy/assets/embeddinggemma-darwin-arm64-metal \
            https://github.com/QuixiAI/embeddinggemma.c/releases/download/v0.3.1/embeddinggemma-darwin-arm64-metal
          echo 'c110806fcb22514c43bb237865340fec94d14d8de8466eeed7b5d288c58ce8b5  deploy/assets/embeddinggemma-darwin-arm64-metal' | sha256sum -c -
          chmod 755 deploy/assets/embeddinggemma-darwin-arm64-metal
      - name: Package release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ROOT="sovereign-stack-$VERSION"
          mkdir -p "$ROOT"
          cp -R deploy docs schemas api release "$ROOT/"
          cp VERSION LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md CHANGELOG.md "$ROOT/"
          rm -rf "$ROOT/deploy/.env" "$ROOT/deploy/models" "$ROOT/deploy/logs" \
            "$ROOT/deploy/reports" "$ROOT/deploy/backups" "$ROOT/deploy/bundles" "$ROOT/deploy/secrets"
          cp -R "$ROOT" release-stage
          tar -czf "$ROOT.tar.gz" "$ROOT"
          sha256sum "$ROOT.tar.gz" > "$ROOT.tar.gz.sha256"
      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release-stage
          output-file: sovereign-stack.spdx.json
          format: spdx-json
      - name: Sign release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="sovereign-stack-$VERSION.tar.gz"
          mv sovereign-stack.spdx.json "sovereign-stack-$VERSION.spdx.json"
          cosign sign-blob --yes --bundle "$ARCHIVE.sigstore.json" "$ARCHIVE"
          cosign sign-blob --yes --bundle release-manifest.sigstore.json release/manifest.json
          cp release/manifest.json "sovereign-release-manifest-$VERSION.json"
      - name: Verify piped installer against signed release archive
        run: |
          set -euo pipefail
          TEST_ROOT="$RUNNER_TEMP/sovereign-piped-install"
          mkdir -p "$TEST_ROOT/user-home"
          cat deploy/scripts/install.sh | env \
            HOME="$TEST_ROOT/user-home" \
            PATH="$GITHUB_WORKSPACE/tests/fixtures/bin:$PATH" \
            SOVEREIGN_HOME="$TEST_ROOT/appliance" \
            SOVEREIGN_BIN_DIR="$TEST_ROOT/bin" \
            SOVEREIGN_RELEASE_URL="file://$GITHUB_WORKSPACE" \
            SOVEREIGN_VERSION="${GITHUB_REF_NAME#v}" \
            SOVEREIGN_INCLUDE_MODELS=0 \
            SOVEREIGN_SKIP_START=1 \
            SOVEREIGN_TEST_UNAME_S=Linux \
            SOVEREIGN_TEST_UNAME_M=x86_64 \
            SOVEREIGN_OS_RELEASE="$GITHUB_WORKSPACE/tests/fixtures/os-release" \
            bash -s -- --profile cuda-x86_64
          test "$(readlink "$TEST_ROOT/appliance/current")" = \
            "$TEST_ROOT/appliance/releases/${GITHUB_REF_NAME#v}"
          grep -qx "SOVEREIGN_VERSION=${GITHUB_REF_NAME#v}" "$TEST_ROOT/appliance/.env"
          for key in SOVEREIGN_CONTROL_IMAGE SOVEREIGN_DOCKER_PROXY_IMAGE \
            SOVEREIGN_EVALS_IMAGE SOVEREIGN_WORKSPACE_IMAGE SOVEREIGN_RUNTIME_IMAGE \
            SOVEREIGN_EMBEDDINGS_IMAGE; do
            grep -Eq "^$key=ghcr.io/lazarus-ai-research/[^@]+@sha256:[0-9a-f]{64}$" \
              "$TEST_ROOT/appliance/.env"
          done
          docker compose \
            --project-directory "$TEST_ROOT/appliance" \
            --env-file "$TEST_ROOT/appliance/.env" \
            -f "$TEST_ROOT/appliance/current/deploy/compose/compose.yml" \
            -f "$TEST_ROOT/appliance/current/deploy/compose/compose.runtime.cuda.yml" \
            --profile tools config > "$TEST_ROOT/compose.yml"
          for image in sovereign-control sovereign-docker-proxy sovereign-evals \
            sovereign-workspace sovereign-runtime sovereign-embeddings; do
            grep -Eq "image: ghcr.io/lazarus-ai-research/$image:[^ ]+@sha256:[0-9a-f]{64}$" \
              "$TEST_ROOT/compose.yml"
          done
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: |
            sovereign-stack-*.tar.gz
            sovereign-stack-*.tar.gz.sha256
            sovereign-stack-*.tar.gz.sigstore.json
            sovereign-stack-*.spdx.json
            sovereign-release-manifest-*.json
            release-manifest.sigstore.json
