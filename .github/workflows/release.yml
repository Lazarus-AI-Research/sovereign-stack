name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io/lazarus-ai-research

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control/web/package-lock.json
      - name: Require exact release version
        run: test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
      - name: Shell and repository checks
        run: |
          bash -n deploy/scripts/*.sh deploy/scripts/sovereign packaging/sovereign-install packaging/macos/build-package.sh packaging/macos/postinstall packaging/macos/launch-install.command packaging/linux/*.sh packaging/linux/postinst packaging/linux/prerm packaging/linux/package-install
          chmod +x tests/scripts/*.sh
          tests/scripts/release-artifacts.sh
          tests/scripts/macos-package-entrypoint.sh
          git diff --check
      - name: Go services
        run: |
          (cd control && go vet ./... && go test ./...)
          (cd docker-proxy && go vet ./... && go test ./...)
      - name: Evals and schema contracts
        run: |
          python -m pip install -e 'evals[dev]' jsonschema PyYAML
          pytest evals/tests
          python release/validate_contracts.py
      - name: Control UI
        run: npm ci --prefix control/web --no-fund --no-audit && npm run build --prefix control/web
      - name: Compose contracts
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --project-directory deploy --env-file deploy/.env \
            -f deploy/compose/compose.yml -f deploy/compose/compose.runtime.cuda.yml config -q
          docker compose --project-directory deploy --env-file deploy/.env \
            -f deploy/compose/compose.yml -f deploy/compose/compose.runtime.metal.yml config -q

  native-linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Ubuntu installer package
        run: |
          packaging/linux/build-package.sh \
            --version "${GITHUB_REF_NAME#v}" --output-dir "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: SovereignStack-*.deb
          if-no-files-found: error

  native-macos:
    needs: validate
    runs-on: macos-15
    env:
      MACOS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
      MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
      APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
      APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS installer with optional Apple signing
        run: |
          set -euo pipefail
          signing_values=(
            "$MACOS_INSTALLER_CERT_P12_BASE64"
            "$MACOS_INSTALLER_CERT_PASSWORD"
            "$MACOS_INSTALLER_IDENTITY"
            "$APPLE_NOTARY_ID"
            "$APPLE_NOTARY_TEAM_ID"
            "$APPLE_NOTARY_PASSWORD"
          )
          signing_count=0
          for value in "${signing_values[@]}"; do
            if [[ -n "$value" ]]; then
              signing_count=$((signing_count + 1))
            fi
          done
          if (( signing_count != 0 && signing_count != ${#signing_values[@]} )); then
            echo "Apple signing configuration is partial; configure all six credentials or none." >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          UNSIGNED_PACKAGE="$(packaging/macos/build-package.sh \
            --version "$VERSION" --output-dir "$RUNNER_TEMP")"

          if (( signing_count == 0 )); then
            cp "$UNSIGNED_PACKAGE" "SovereignStack-$VERSION-arm64-unsigned.pkg"
            {
              echo "### Unsigned macOS installer"
              echo "Apple credentials were not configured. Publishing the explicitly named unsigned package with SHA-256 and Sigstore verification artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/sovereign-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_INSTALLER_CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/installer.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/installer.p12" -P "$MACOS_INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          productsign --sign "$MACOS_INSTALLER_IDENTITY" "$UNSIGNED_PACKAGE" "SovereignStack-$VERSION-arm64.pkg"
          xcrun notarytool submit "SovereignStack-$VERSION-arm64.pkg" \
            --apple-id "$APPLE_NOTARY_ID" --team-id "$APPLE_NOTARY_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" --wait
          xcrun stapler staple "SovereignStack-$VERSION-arm64.pkg"
          pkgutil --check-signature "SovereignStack-$VERSION-arm64.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: SovereignStack-*.pkg
          if-no-files-found: error

  images:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sovereign-control
            dockerfile: control/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: sovereign-docker-proxy
            dockerfile: docker-proxy/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: sovereign-evals
            dockerfile: evals/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: sovereign-workspace
            dockerfile: workspace/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: sovereign-embeddings
            dockerfile: embeddinggemma/Dockerfile.cuda
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
      - name: Sign image index
        run: cosign sign --yes "${REGISTRY}/${{ matrix.name }}:${VERSION}@${{ steps.build.outputs.digest }}"
      - name: Record digest
        run: |
          mkdir -p digests
          printf '%s\n' '${{ steps.build.outputs.digest }}' > 'digests/${{ matrix.name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          if-no-files-found: error

  publish:
    needs: [validate, images, native-linux, native-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - name: Stage native installers
        run: mv native/SovereignStack-* .
      - name: Resolve required runtime releases
        run: |
          set -euo pipefail
          RUNTIME_VERSION="$(jq -r .runtime_version release/release-source.json)"
          for profile in cuda-x86_64 metal-arm64; do
            ref="$REGISTRY/sovereign-runtime:$profile-$RUNTIME_VERSION"
            digest=""
            for attempt in 1 2 3; do
              if inspection="$(docker buildx imagetools inspect "$ref")"; then
                digest="$(printf '%s\n' "$inspection" | awk '/^Digest:/ {print $2; exit}')"
                [[ -n "$digest" ]] && break
              fi
              echo "::warning::Could not resolve $ref (attempt $attempt of 3)"
              sleep $((attempt * 2))
            done
            [[ -n "$digest" ]] || { echo "Unable to resolve $ref after 3 attempts" >&2; exit 1; }
            case "$profile" in
              cuda-x86_64) name=sovereign-runtime-cuda ;;
              metal-arm64) name=sovereign-runtime-metal ;;
            esac
            printf '%s\n' "$digest" > "digests/$name"
            verified=0
            for attempt in 1 2 3; do
              if cosign verify \
                --certificate-identity-regexp '^https://github.com/Lazarus-AI-Research/sovereign-vllm/.github/workflows/release.yml@refs/tags/v' \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "$ref@$digest" >/dev/null; then
                verified=1
                break
              fi
              echo "::warning::Could not verify $ref@$digest (attempt $attempt of 3)"
              sleep $((attempt * 2))
            done
            (( verified == 1 )) || { echo "Unable to verify $ref@$digest after 3 attempts" >&2; exit 1; }
          done
          METAL_ARTIFACT="$(jq -r .metal_agent.artifact release/release-source.json)"
          METAL_URL="$(jq -r .metal_agent.url release/release-source.json)"
          METAL_SIGNATURE_URL="$(jq -r .metal_agent.signature_url release/release-source.json)"
          METAL_SHA256="$(jq -r .metal_agent.sha256 release/release-source.json)"
          METAL_BYTES="$(jq -r .metal_agent.bytes release/release-source.json)"
          METAL_SIGNER="$(jq -r .metal_agent.signer_identity_regexp release/release-source.json)"
          curl -fsSL --retry 4 -o "$METAL_ARTIFACT" "$METAL_URL"
          curl -fsSL --retry 4 -o "$METAL_ARTIFACT.sigstore.json" "$METAL_SIGNATURE_URL"
          echo "$METAL_SHA256  $METAL_ARTIFACT" | sha256sum -c -
          test "$(stat -c %s "$METAL_ARTIFACT")" = "$METAL_BYTES"
          cosign verify-blob \
            --bundle "$METAL_ARTIFACT.sigstore.json" \
            --certificate-identity-regexp "$METAL_SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$METAL_ARTIFACT"
          while IFS= read -r dependency; do
            name="$(jq -r '.key' <<<"$dependency")"
            artifact="$(jq -r '.value.artifact' <<<"$dependency")"
            url="$(jq -r '.value.url' <<<"$dependency")"
            sha256="$(jq -r '.value.sha256' <<<"$dependency")"
            bytes="$(jq -r '.value.bytes' <<<"$dependency")"
            signature_url="$(jq -r '.value.signature_url // empty' <<<"$dependency")"
            signer="$(jq -r '.value.signer_identity_regexp // empty' <<<"$dependency")"
            curl -fsSL --retry 4 -o "$artifact" "$url"
            echo "$sha256  $artifact" | sha256sum -c -
            test "$(stat -c %s "$artifact")" = "$bytes"
            if [[ -n "$signature_url" ]]; then
              curl -fsSL --retry 4 -o "$artifact.sigstore.json" "$signature_url"
              cosign verify-blob \
                --bundle "$artifact.sigstore.json" \
                --certificate-identity-regexp "$signer" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "$artifact"
            fi
            echo "verified installer dependency $name $artifact"
          done < <(jq -c '.installer_dependencies["metal-arm64"] | to_entries[]' release/release-source.json)
      - name: Generate release manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 release/generate_manifest.py \
            --digest-dir digests \
            --stack-commit "$GITHUB_SHA" \
            --output release/manifest.json \
            --image-lock-output release/images.env
          python3 -m pip install jsonschema PyYAML
          python3 release/validate_contracts.py
          test "$(python3 -c 'import json; print(json.load(open("release/manifest.json"))["version"])')" = "$VERSION"
      - name: Vendor pinned EmbeddingGemma Metal executable
        run: |
          set -euo pipefail
          EMBEDDING_ARTIFACT="$(jq -r .embedding_runtime.artifact release/release-source.json)"
          EMBEDDING_URL="$(jq -r .embedding_runtime.url release/release-source.json)"
          EMBEDDING_SHA256="$(jq -r .embedding_runtime.sha256 release/release-source.json)"
          EMBEDDING_BYTES="$(jq -r .embedding_runtime.bytes release/release-source.json)"
          mkdir -p deploy/assets
          curl -fsSL --retry 4 -o "deploy/assets/$EMBEDDING_ARTIFACT" "$EMBEDDING_URL"
          echo "$EMBEDDING_SHA256  deploy/assets/$EMBEDDING_ARTIFACT" | sha256sum -c -
          test "$(stat -c %s "deploy/assets/$EMBEDDING_ARTIFACT")" = "$EMBEDDING_BYTES"
          chmod 755 "deploy/assets/$EMBEDDING_ARTIFACT"
      - name: Build host lifecycle binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          (cd control && CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../deploy/assets/sovereign-hostd-darwin-arm64 ./cmd/sovereign-hostd)
          (cd control && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../deploy/assets/sovereign-hostd-linux-amd64 ./cmd/sovereign-hostd)
          chmod 755 deploy/assets/sovereign-hostd-*
      - name: Package release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ROOT="sovereign-stack-$VERSION"
          mkdir -p "$ROOT"
          cp -R deploy docs schemas api release "$ROOT/"
          cp VERSION LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md CHANGELOG.md "$ROOT/"
          rm -rf "$ROOT/deploy/.env" "$ROOT/deploy/models" "$ROOT/deploy/logs" \
            "$ROOT/deploy/reports" "$ROOT/deploy/backups" "$ROOT/deploy/bundles" "$ROOT/deploy/secrets"
          cp -R "$ROOT" release-stage
          tar -czf "$ROOT.tar.gz" "$ROOT"
          sha256sum "$ROOT.tar.gz" > "$ROOT.tar.gz.sha256"
      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release-stage
          output-file: sovereign-stack.spdx.json
          format: spdx-json
      - name: Sign release artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="sovereign-stack-$VERSION.tar.gz"
          mv sovereign-stack.spdx.json "sovereign-stack-$VERSION.spdx.json"
          cosign sign-blob --yes --bundle "$ARCHIVE.sigstore.json" "$ARCHIVE"
          cosign sign-blob --yes --bundle release-manifest.sigstore.json release/manifest.json
          for installer in SovereignStack-*.pkg SovereignStack-*.deb; do
            sha256sum "$installer" > "$installer.sha256"
            cosign sign-blob --yes --bundle "$installer.sigstore.json" "$installer"
          done
          cp release/manifest.json "sovereign-release-manifest-$VERSION.json"
      - name: Verify piped installer against signed release archive
        run: |
          set -euo pipefail
          TEST_ROOT="$RUNNER_TEMP/sovereign-piped-install"
          mkdir -p "$TEST_ROOT/user-home"
          cat deploy/scripts/install.sh | env \
            HOME="$TEST_ROOT/user-home" \
            PATH="$GITHUB_WORKSPACE/tests/fixtures/bin:$PATH" \
            SOVEREIGN_HOME="$TEST_ROOT/appliance" \
            SOVEREIGN_BIN_DIR="$TEST_ROOT/bin" \
            SOVEREIGN_RELEASE_URL="file://$GITHUB_WORKSPACE" \
            SOVEREIGN_VERSION="${GITHUB_REF_NAME#v}" \
            SOVEREIGN_INCLUDE_MODELS=0 \
            SOVEREIGN_SKIP_START=1 \
            SOVEREIGN_TEST_UNAME_S=Linux \
            SOVEREIGN_TEST_UNAME_M=x86_64 \
            SOVEREIGN_OS_RELEASE="$GITHUB_WORKSPACE/tests/fixtures/os-release" \
            bash -s -- --profile cuda-x86_64
          test "$(readlink "$TEST_ROOT/appliance/current")" = \
            "$TEST_ROOT/appliance/releases/${GITHUB_REF_NAME#v}"
          grep -qx "SOVEREIGN_VERSION=${GITHUB_REF_NAME#v}" "$TEST_ROOT/appliance/.env"
          for key in SOVEREIGN_CONTROL_IMAGE SOVEREIGN_DOCKER_PROXY_IMAGE \
            SOVEREIGN_EVALS_IMAGE SOVEREIGN_WORKSPACE_IMAGE SOVEREIGN_RUNTIME_IMAGE \
            SOVEREIGN_EMBEDDINGS_IMAGE; do
            grep -Eq "^$key=ghcr.io/lazarus-ai-research/[^@]+@sha256:[0-9a-f]{64}$" \
              "$TEST_ROOT/appliance/.env"
          done
          docker compose \
            --project-directory "$TEST_ROOT/appliance" \
            --env-file "$TEST_ROOT/appliance/.env" \
            -f "$TEST_ROOT/appliance/current/deploy/compose/compose.yml" \
            -f "$TEST_ROOT/appliance/current/deploy/compose/compose.runtime.cuda.yml" \
            --profile tools config > "$TEST_ROOT/compose.yml"
          for image in sovereign-control sovereign-docker-proxy sovereign-evals \
            sovereign-workspace sovereign-runtime sovereign-embeddings; do
            grep -Eq "image: ghcr.io/lazarus-ai-research/$image:[^ ]+@sha256:[0-9a-f]{64}$" \
              "$TEST_ROOT/compose.yml"
          done
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: |
            sovereign-stack-*.tar.gz
            sovereign-stack-*.tar.gz.sha256
            sovereign-stack-*.tar.gz.sigstore.json
            sovereign-stack-*.spdx.json
            sovereign-release-manifest-*.json
            release-manifest.sigstore.json
            SovereignStack-*.pkg
            SovereignStack-*.pkg.sha256
            SovereignStack-*.pkg.sigstore.json
            SovereignStack-*.deb
            SovereignStack-*.deb.sha256
            SovereignStack-*.deb.sigstore.json
