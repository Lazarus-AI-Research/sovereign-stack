name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: control
        run: cd control && go vet ./... && go build ./... && go test ./...
      - name: docker-proxy
        run: cd docker-proxy && go vet ./... && go build ./... && go test ./...

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'evals[dev]'
      - run: pytest evals/tests

  contracts-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control/web/package-lock.json
      - run: python -m pip install jsonschema PyYAML
      - name: Schemas, manifests, and API
        run: |
          python release/validate_contracts.py
          python - <<'PY'
          import yaml
          document = yaml.safe_load(open("api/sovereign-control.openapi.yaml"))
          assert document["openapi"] == "3.1.0"
          assert len(document["paths"]) >= 50
          PY
      - name: Shipped scripts
        run: |
          bash -n deploy/scripts/*.sh deploy/scripts/sovereign packaging/sovereign-install packaging/macos/postinstall packaging/macos/launch-install.command packaging/linux/*.sh packaging/linux/postinst packaging/linux/prerm packaging/linux/package-install
          node --check workspace/sovereign/preload.js
          chmod +x tests/fixtures/bin/* tests/scripts/*.sh
          tests/scripts/release-artifacts.sh
          tests/scripts/install-lifecycle.sh
          tests/scripts/container-engine.sh
          tests/scripts/hardware-detection.sh
          tests/scripts/ubuntu-provisioning.sh
          tests/scripts/ubuntu-install-resume.sh
          tests/scripts/linux-package-entrypoint.sh
          tests/scripts/macos-package-entrypoint.sh
          packaging/linux/build-package.sh --output-dir "$RUNNER_TEMP"
          PACKAGE="$RUNNER_TEMP/SovereignStack-$(cat VERSION)-amd64.deb"
          dpkg-deb --contents "$PACKAGE" > "$RUNNER_TEMP/sovereign-deb-contents.txt"
          grep -q 'usr/local/libexec/sovereign-stack-package-install' "$RUNNER_TEMP/sovereign-deb-contents.txt"
          grep -q 'usr/lib/systemd/system/sovereign-stack-package-install.service' "$RUNNER_TEMP/sovereign-deb-contents.txt"
      - name: Control UI
        run: npm ci --prefix control/web --no-fund --no-audit && npm run build --prefix control/web

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/.env.example deploy/.env
      - run: docker compose --project-directory deploy -f deploy/compose/compose.yml config -q
      - run: docker compose --project-directory deploy -f deploy/compose/compose.yml -f deploy/compose/compose.runtime.mock.yml config -q
      - run: docker compose --project-directory deploy -f deploy/compose/compose.yml -f deploy/compose/compose.runtime.cuda.yml config -q
      - run: docker compose --project-directory deploy -f deploy/compose/compose.yml -f deploy/compose/compose.runtime.metal.yml config -q

  runtime-conformance-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e evals
      - run: docker build -t sovereign-runtime-mock:dev runtime/mock
      - name: run mock
        run: |
          docker run -d --rm --name mock -p 8000:8000 \
            -v "$PWD/deploy/config/runtime.yaml:/runtime-config/runtime.yaml:ro" \
            -e SOVEREIGN_RUNTIME_CONFIG=/runtime-config/runtime.yaml \
            -e SOVEREIGN_RUNTIME_API_KEY=ci-key \
            sovereign-runtime-mock:dev
      - run: sovereign-evals conformance --base-url http://127.0.0.1:8000 --api-key ci-key --wait-ready 60
      - name: healthcheck binary honors the image contract
        run: docker exec mock sovereign-runtime-healthcheck --live
      - if: always()
        run: docker stop mock || true
      - name: §25 lifecycle chaos suite
        run: |
          pip install pytest httpx
          pytest tests/runtime-contract -v
